<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Chats</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/static/shared/fonts/GoogleSansFlex-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/shared/css/tokens.css">
<link rel="stylesheet" href="/static/shared/css/components.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <section class="side">
    <div class="tools" id="tools" hidden>
      <label class="search"><button class="fbtn" id="qback" type="button" title="Suche schließen" aria-label="Suche schließen"><span class="ms">arrow_back</span></button><input id="q" type="search" placeholder="Chats suchen" autocomplete="off" enterkeyhint="search"></label>
    </div>
    <div id="list" class="list" aria-live="polite"></div>
    <nav class="ldock" id="ldock" aria-label="Werkzeuge">
      <button class="dfab" id="fbtn" type="button" title="Filter" aria-label="Filter: Alle"><span class="ms">filter_list</span></button>
      <div class="dbar"><button type="button" id="setbtn" title="Einstellungen" aria-label="Einstellungen"><span class="ms">settings</span></button><button type="button" id="refresh" title="Neu laden" aria-label="Neu laden"><span class="ms">refresh</span></button></div>
      <button class="dfab" id="sbtn" type="button" title="Suchen" aria-label="Suchen"><span class="ms">search</span></button>
    </nav>
  </section>
  <section class="conv" id="conv">
    <div class="conv-empty"><span class="ms">forum</span><p>Wähle einen Chat aus.</p></div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
