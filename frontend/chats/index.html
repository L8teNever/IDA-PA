<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<title>Chats</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/static/shared/fonts/GoogleSansFlex-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/shared/css/tokens.css">
<link rel="stylesheet" href="/static/shared/css/components.css">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <section class="side">
    <header class="top">
      <span class="ida-mini"><i></i><i></i></span>
      <div class="top-ttl"><div class="top-name">Chats</div><div class="top-sub" id="sub">aus Beeper</div></div>
      <button class="icon-btn" id="refresh" title="Neu laden" aria-label="Neu laden"><span class="ms">refresh</span></button>
    </header>
    <div class="tools">
      <label class="search"><span class="ms">search</span><input id="q" type="search" placeholder="Chats suchen" autocomplete="off" enterkeyhint="search"></label>
      <div class="tabs"><button class="tab on" data-f="all">Alle</button><button class="tab" data-f="unread">Ungelesen</button><button class="tab" data-f="archive">Archiv</button></div>
    </div>
    <div id="list" class="list" aria-live="polite"></div>
  </section>
  <section class="conv" id="conv">
    <div class="conv-empty"><span class="ms">forum</span><p>Wähle einen Chat aus.</p></div>
  </section>
</div>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/static/app.js"></script>
</body>
</html>
