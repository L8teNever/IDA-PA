<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>IDA Live – Animationen Vorschau</title>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/ida.css">
<style>
  :root { --accent: #ff8fc8; --accent-rgb: 255,143,200; --face-top: #ffe9f4; --face-bottom: #f6bfdc; }
  html, body { background: #121317; color: #e8e8ee; font-family: system-ui, sans-serif; overflow: auto !important; height: auto !important; }
  body { padding: 20px 14px 60px; max-width: 520px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 4px 0 4px; } .sub { color: #9a9aa8; font-size: 14px; margin-bottom: 18px; }
  .card { background: #1b1c22; border-radius: 22px; padding: 18px 14px 16px; margin-bottom: 16px; text-align: center; position: relative; overflow: hidden; }
  .card h2 { font-size: 15px; margin: 0 0 2px; text-align: left; } .card p { font-size: 13px; color: #9a9aa8; margin: 0 0 12px; text-align: left; }
  .stage { height: 150px; display: flex; align-items: center; justify-content: center; position: relative; }
  .stage .buddy { width: 118px; animation: none; }
  .glow { position: absolute; width: 190px; height: 190px; border-radius: 50%; background: radial-gradient(closest-side, rgba(var(--accent-rgb), .35), transparent 70%); filter: blur(18px); }
  .status { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 99px; background: #3a1029; color: #ffd8ea; font-size: 14px; min-height: 20px; }
  button.again { margin-top: 10px; background: #2a2b33; color: #e8e8ee; border: 0; border-radius: 99px; padding: 8px 16px; font-size: 13px; }

  /* 1 Aufwachen */
  .c1 .eye { animation: none; transform: scaleY(.08); }
  .c1.go .eye { animation: wake 3.2s ease-out forwards; }
  .c1 .glow { opacity: .1; } .c1.go .glow { animation: glowup 3.2s ease-out forwards; }
  .c1 .face { filter: brightness(.55); } .c1.go .face { animation: faceup 3.2s ease-out forwards; }
  @keyframes wake { 0%, 30% { transform: scaleY(.08) } 40% { transform: scaleY(1) } 48% { transform: scaleY(.1) } 56%, 100% { transform: scaleY(1) } }
  @keyframes glowup { to { opacity: 1 } } @keyframes faceup { to { filter: brightness(1) } }
  /* 2 Scan-Ring */
  .c2 .ring { position: absolute; width: 168px; height: 168px; border-radius: 50%; border: 2px solid rgba(var(--accent-rgb), .15); border-top-color: var(--accent); animation: spin 1.1s linear infinite; }
  .c2 .ring2 { width: 196px; height: 196px; animation-duration: 1.8s; animation-direction: reverse; border-top-color: rgba(var(--accent-rgb), .6); }
  @keyframes spin { to { transform: rotate(360deg) } }
  /* 3 Umschauen */
  .c3 .eyes { animation: look 3.4s ease-in-out infinite; }
  @keyframes look { 0%, 12% { transform: translate(-50%, -50%) } 22%, 40% { transform: translate(-90%, -50%) } 52%, 68% { transform: translate(-10%, -50%) } 80%, 100% { transform: translate(-50%, -50%) } }
  /* 4 Atmen */
  .c4 .buddy { animation: breathe 2.6s ease-in-out infinite; } .c4 .glow { animation: pulse 2.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(.9) } 50% { opacity: 1; transform: scale(1.1) } }
  /* 5 Punkte */
  .dots { display: inline-flex; gap: 6px; } .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: dotb 1s infinite; } .dots i:nth-child(2) { animation-delay: .15s } .dots i:nth-child(3) { animation-delay: .3s }
  .c5 .buddy { animation: float 3.4s ease-in-out infinite; }
  /* 6 Statuszeilen */
  .lines span { position: absolute; opacity: 0; animation: line 6s infinite; } .lines { position: relative; display: inline-block; width: 190px; height: 20px; }
  .lines span:nth-child(2) { animation-delay: 2s } .lines span:nth-child(3) { animation-delay: 4s }
  @keyframes line { 0% { opacity: 0; transform: translateY(6px) } 6%, 28% { opacity: 1; transform: none } 34%, 100% { opacity: 0; transform: translateY(-6px) } }
  .c6 .buddy { animation: float 4s ease-in-out infinite; }
</style>
</head>
<body>
<h1>Animationen beim Verbinden</h1>
<div class="sub">So könnte „Verbinde …“ in der Live-App aussehen. Sag mir die Nummer(n), die ich einbauen soll – auch kombiniert, z. B. 1 + 6.</div>
<div id="cards"></div>
<script>
const buddy = `<div class="buddy"><div class="face"><div class="eyes"><div class="eye"></div><div class="eye"></div></div></div></div>`;
const demos = [
  { n: 1, t: "Aufwachen", d: "Augen zu, Blinzeln, Leuchten fährt hoch.", extra: "", status: "Verbinde …", replay: true },
  { n: 2, t: "Scan-Ring", d: "Zwei dünne Ringe kreisen wie bei einem Systemstart.", extra: '<i class="ring"></i><i class="ring ring2"></i>', status: "Systeme online …" },
  { n: 3, t: "Umschauen", d: "Die Augen suchen dich: links, rechts, dann geradeaus.", extra: "", status: "Verbinde …" },
  { n: 4, t: "Atmen", d: "Ruhiges Pulsieren von Gesicht und Leuchten. Die dezenteste Variante.", extra: "", status: "Verbinde …" },
  { n: 5, t: "Punkte-Welle", d: "Drei Punkte hüpfen nacheinander.", extra: "", status: '<span class="dots"><i></i><i></i><i></i></span>' },
  { n: 6, t: "Wechselnde Statuszeilen", d: "Text wechselt alle zwei Sekunden (mit jeder anderen Variante kombinierbar).", extra: "", status: '<span class="lines"><span>Verbinde …</span><span>Einen Moment, Simon …</span><span>Gleich bereit …</span></span>' },
];
document.getElementById("cards").innerHTML = demos.map(x => `<div class="card c${x.n} ${x.replay ? "go" : ""}" id="c${x.n}">
  <h2>${x.n}. ${x.t}</h2><p>${x.d}</p>
  <div class="stage"><div class="glow"></div>${x.extra}${buddy}</div>
  <div class="status">${x.status}</div>${x.replay ? '<br><button class="again" onclick="replay()">Nochmal abspielen</button>' : ""}</div>`).join("");
setInterval(() => replay(), 6000);
function replay() { const c = document.getElementById("c1"); c.classList.remove("go"); void c.offsetWidth; c.classList.add("go"); }
</script>
</body>
</html>
