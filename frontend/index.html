<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="IDA">
<title>IDA</title>
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/static/icons/favicon-64.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="preload" href="/static/fonts/MaterialSymbolsRounded.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/tokens.css">
<link rel="stylesheet" href="/static/css/components.css">
<link rel="stylesheet" href="/static/css/ida.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header id="appHeader">
  <button class="icon-btn" id="btnMenu" aria-label="Menü"><span class="ms">menu</span></button>
  <button class="icon-btn" id="btnBack" aria-label="Zurück"><span class="ms">arrow_back</span></button>
  <button class="hdr-mini" id="hdrMini" aria-label="Nach oben"><span class="eyes-mini"><i></i><i></i></span></button>
  <div class="spacer"></div>
  <button class="hdr-bell" id="hdrBell" aria-label="Infos anzeigen"><span class="ms">notifications</span><span id="bellCount">0</span></button>
  <div class="agent-wrap" id="agentWrap">
    <button class="agent-btn" id="agentBtn" aria-haspopup="menu">
      <span class="dot" id="agentDot">I</span>
      <span id="agentName">Ida</span>
      <span class="ms chev">expand_more</span>
    </button>
    <div class="menu" role="menu" id="agentMenu"></div>
  </div>
</header>

<main>
  <!-- Startseite des Haupt-Agenten: Infos + Heute -->
  <div class="stage home" id="home" hidden>
    <div class="hero">
      <div class="buddy small" id="buddySmall" role="button" aria-label="Animationen ansehen">
        <div class="face"><div class="eyes" id="eyes"><div class="eye"></div><div class="eye"></div></div></div>
        <div class="props"></div>
      </div>
      <div>
        <div class="day" id="dayName"></div>
        <div class="sub" id="daySub"></div>
      </div>
    </div>
    <section class="notes" id="notes" hidden></section>
    <div class="sec-label"><span>Heute</span><span id="pastSlot"></span></div>
    <div class="timeline" id="timeline"></div>
  </div>

  <!-- Startseite der anderen Agents -->
  <div class="stage agent-home" id="agentHome" hidden>
    <div class="buddy big" id="buddyBig" role="button" aria-label="Animationen ansehen">
      <div class="face"><div class="eyes" id="eyesBig"><div class="eye"></div><div class="eye"></div></div></div>
      <div class="props"></div>
    </div>
    <div class="ah-name" id="ahName"></div>
    <div class="ah-desc" id="ahDesc"></div>
    <div class="ah-chips" id="ahChips"></div>
  </div>

  <!-- Alle anderen Seiten werden hier hineingerendert -->
  <div class="stage page" id="page" data-page="page" hidden></div>

  <!-- Chatverlauf -->
  <div class="messages" id="messages"></div>
</main>

<aside class="code-pane left" id="codeLeft"></aside>
<aside class="code-pane right" id="codeRight"></aside>

<form class="composer" id="composer" autocomplete="off">
  <div class="field">
    <div class="model-menu" id="modelMenu" role="menu"></div>
    <div class="slash-menu" id="slashMenu" role="listbox"></div>
    <div class="queue" id="queue" hidden></div>
    <div class="att-list" id="attList" hidden></div>
    <div class="field-row">
      <textarea id="input" rows="1" placeholder="Schreib Ida was…"></textarea>
      <button type="button" class="mic-btn" id="micBtn" aria-label="Sprechen" title="Sprechen – wird lokal in Text umgewandelt (Esc bricht ab)"><span class="ms">mic</span></button>
    </div>
    <div class="mic-info" id="micInfo" hidden></div>
    <div class="field-tools">
      <button type="button" class="model-chip" id="modelBtn" aria-haspopup="menu" aria-label="Modell wählen">
        <span class="ms" id="modelIcon">auto_awesome</span><span id="modelName">Modell</span><span class="ms mchev">expand_more</span>
      </button>
      <button type="button" class="model-chip" id="skillBtn" aria-label="Skill einfügen"><span class="ms">auto_fix_high</span><span>Skills</span></button>
      <button type="button" class="model-chip" id="attachBtn" aria-label="Datei oder Bild anhängen" title="Bilder, PDFs, Textdateien – auch einfügen (Strg+V) oder hineinziehen"><span class="ms">attach_file</span><span>Datei</span></button>
      <input type="file" id="fileInput" multiple hidden accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/*,.md,.csv,.json,.xml,.yaml,.yml,.log,.ics,.py,.js,.ts,.html,.css,.sql">
      <span class="lim-now" id="limNow"></span>
    </div>
  </div>
  <button class="send" id="send" type="submit" disabled aria-label="Senden"><span class="ms">arrow_upward</span></button>
</form>

<div class="scrim" id="scrim"></div>
<div class="ev-scrim" id="evScrim"></div>
<section class="ev-sheet" id="evSheet" role="dialog"></section>

<aside class="drawer" id="drawerMenu">
  <div class="side-top">
    <span class="side-mini"><i></i><i></i></span>
    <div><div class="side-title" id="sideAgent">Ida</div><div class="side-sub">Menü</div></div>
  </div>
  <nav class="side-nav" id="sideNav">
    <a href="/" data-nav="home"><span class="ms">home</span>Start</a>
    <a href="/kalender" data-nav="kalender"><span class="ms">calendar_month</span>Kalender</a>
    <a href="/chats" data-nav="chats"><span class="ms">forum</span>Chats</a>
    <a href="/nachrichten" data-nav="nachrichten"><span class="ms">notifications</span>Nachrichten<b class="nav-badge" id="navBadge" hidden></b></a>
    <a href="/routinen" data-nav="routinen"><span class="ms">schedule</span>Routinen</a>
    <a href="/erinnerungen" data-nav="erinnerungen"><span class="ms">alarm</span>Erinnerungen</a>
    <a href="/tracker" data-nav="tracker"><span class="ms">checklist</span>Tracker</a>
    <a href="/code" data-nav="code" hidden><span class="ms">code</span>Code</a>
    <a href="/limits" data-nav="limits"><span class="ms">data_usage</span>KI-Limit</a>
    <div class="side-sec">System</div>
    <a href="/einstellungen" data-nav="einstellungen"><span class="ms">settings</span>Einstellungen</a>
    <button type="button" id="btnInstall" hidden><span class="ms">install_desktop</span>App installieren</button>
  </nav>
</aside>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
