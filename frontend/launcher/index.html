<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<title>Apps</title>
<link rel="stylesheet" href="/static/shared/css/tokens.css">
<link rel="stylesheet" href="/static/css/launcher.css?v=__V__">
</head>
<body>
<div class="lc-bg" id="lcBg" aria-hidden="true"></div>
<button type="button" class="lc-bgbtn" id="lcBgBtn" title="Hintergrundbilder" aria-label="Hintergrundbilder"><span class="ms">wallpaper</span></button>
<dialog class="lc-dlg" id="lcDlg">
  <div class="lc-dlg-head"><h2>Hintergrundbilder</h2><button type="button" class="lc-x" id="lcDlgClose" aria-label="Schließen"><span class="ms">close</span></button></div>
  <p class="lc-dlg-sub">Bei jedem Öffnen wird eines davon zufällig gezeigt.</p>
  <div class="lc-thumbs" id="lcThumbs"></div>
  <p class="lc-dlg-msg" id="lcDlgMsg" role="status"></p>
  <label class="lc-allbtn lc-add"><span class="ms">add_photo_alternate</span> Bilder hinzufügen<input type="file" id="lcFile" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden></label>
</dialog>
<div class="lc-sb" id="lcSb" aria-hidden="true"><i></i></div>
<main class="lc">
  <div class="lc-clock" id="lcClock" aria-live="off"><div class="lc-time" id="lcTime"></div><div class="lc-date" id="lcDate"></div></div>
  <h1 id="lcTitle">Willkommen zurück!</h1>
  <label class="lc-search">
    <span class="ms">search</span>
    <input id="lcSearch" type="search" placeholder="Apps suchen" autocomplete="off" spellcheck="false" autofocus>
  </label>
  <div id="lcGrid" aria-live="polite"></div>
  <p class="lc-empty" id="lcEmpty" hidden></p>
</main>
<script type="module" src="/static/js/launcher.js?v=__V__"></script>
</body>
</html>
