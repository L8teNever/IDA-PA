server {
    listen 8000;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health { access_log off; default_type text/plain; return 200 "ok\n"; }

    # Früher lief der Editor als CLEO unter /version/vN/ – alte Lesezeichen und installierte Apps landen auf der einen aktuellen Fassung
    location ^~ /version/ { return 302 /; }

    location ^~ /lib/ { expires 30d; add_header Cache-Control "public"; }
    location ^~ /fonts/ { expires 30d; add_header Cache-Control "public"; }

    # alles andere (index.html, sw.js, Stile): bei jedem Laden prüfen, damit Updates sofort ankommen
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
