<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handy-Freigabe</title>
<style>
  :root {
    --accent: #7fd3ff; --accent-rgb: 127,211,255; --on-accent: #00344a;
    --container: #0e2a38; --on-container: #c4ecff;
    --surface: #121316; --surface-high: #1d1f23; --surface-highest: #282a2f;
    --on-surface: #e3e2e6; --muted: #9a9ca3;
    --spring: cubic-bezier(.34,1.56,.64,1); --emph: cubic-bezier(.2,0,0,1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #000; color: var(--on-surface);
    font-family: "Google Sans Flex","Google Sans",Roboto,system-ui,sans-serif;
    display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 16px;
  }
  .card {
    width: 100%; max-width: 360px; background: var(--surface-high); border-radius: 32px;
    padding: 28px 28px 24px; text-align: center;
    box-shadow: 0 0 0 1px rgba(255,255,255,.04), 0 16px 48px rgba(0,0,0,.6);
    animation: pop .5s var(--spring) both;
  }
  @keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 999px;
    background: var(--container); color: var(--on-container); font-size: 13px; font-weight: 500;
  }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px rgba(var(--accent-rgb),.8); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
  h1 { font-size: 22px; font-weight: 500; margin: 18px 0 4px; }
  .qr {
    margin: 20px auto 18px; width: 252px; height: 252px; padding: 12px; border-radius: 24px;
    background: #fff; box-shadow: 0 0 36px rgba(60,170,220,.35); display: flex; align-items: center; justify-content: center;
  }
  .qr img { width: 100%; height: 100%; display: block; border-radius: 8px; }
  p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .steps { margin-top: 18px; padding: 12px 16px; border-radius: 20px; background: var(--surface-highest); text-align: left; font-size: 13px; color: var(--on-surface); line-height: 1.6; }
  .steps b { color: var(--accent); font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <span class="chip"><i></i>Wartet auf dein Handy</span>
    <h1>Handy-Freigabe</h1>
    <p>Scanne den QR-Code mit der Handykamera, um den PC freizuschalten.</p>
    <div class="qr"><img src="${qrApiUrl}" alt="QR Code"></div>
    <div class="steps"><b>1</b> Kamera öffnen und scannen<br><b>2</b> Am Handy anmelden<br><b>3</b> Dieser Tab geht von selbst weiter</div>
  </div>
  <script>
    const check = setInterval(async () => {
      const res = await fetch('/poll?sid=${sid}');
      if (res.ok) {
        const data = await res.json();
        if (data.redirect) { clearInterval(check); window.location.href = data.redirect; }
      }
    }, 1000);
  </script>
</body>
</html>
