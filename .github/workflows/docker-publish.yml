# Tests (IDA: SQLite + PostgreSQL, Kalender/Wiki: SQLite, Code), dann Images bauen und nach GHCR pushen
# (ghcr.io/<owner>/<repo>:latest, ida-kalender:latest, ida-wiki:latest, ida-code:latest, ida-dashboard:latest, ida-tasks:latest, ida-html:latest, ida-docs:latest, ida-launcher:latest, ida-google-stack:latest, ida-mail:latest, ida-chats:latest).
name: Test & Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: ida, POSTGRES_USER: ida, POSTGRES_PASSWORD: ida }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ida" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://ida:ida@localhost:5432/ida' || '' }}
        run: python -m pytest

  kalender-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: kalender/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  kalender-frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Node-Tests (Offline-Logik der Oberfläche)
        run: node --test "frontend/kalender/test/*.test.mjs"

  kalender-upgrade:
    # Das neue Image startet auf den Daten des aktuell veröffentlichten – nichts geht verloren, die API bleibt für alte Clients kompatibel
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Vorgänger-Image holen und neues bauen
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          docker pull "ghcr.io/$OWNER/ida-kalender:latest"
          docker build -f kalender/Dockerfile -t ida-kalender:new .
          echo "OLD_IMAGE=ghcr.io/$OWNER/ida-kalender:latest" >> "$GITHUB_ENV"
      - run: pip install httpx pytest
      - name: Upgrade-Test
        env:
          NEW_IMAGE: ida-kalender:new
        run: python -m pytest kalender/upgrade -q

  wiki-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: wiki/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  code-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: code/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  dashboard-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: dashboard/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  tasks-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tasks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: tasks/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  docs-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dokumente
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: dokumente/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  google-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: google
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: google/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  launcher-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: launcher/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  mail-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: mail/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  chats-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chats
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: chats/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  image:
    needs: [test, kalender-test, kalender-frontend-test, wiki-test, code-test, dashboard-test, tasks-test, docs-test, google-test, launcher-test, mail-test, chats-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: ida, dockerfile: Dockerfile, image: "ghcr.io/${{ github.repository }}" }
          - { name: kalender, dockerfile: kalender/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-kalender" }
          - { name: wiki, dockerfile: wiki/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-wiki" }
          - { name: code, dockerfile: code/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-code" }
          - { name: dashboard, dockerfile: dashboard/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-dashboard" }
          - { name: tasks, dockerfile: tasks/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-tasks" }
          - { name: html, dockerfile: html/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-html" }
          - { name: docs, dockerfile: dokumente/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-docs" }
          - { name: launcher, dockerfile: launcher/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-launcher" }
          - { name: google, dockerfile: google/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-google-stack" }
          - { name: mail, dockerfile: mail/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-mail" }
          - { name: chats, dockerfile: chats/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-chats" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
