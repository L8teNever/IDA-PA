# Tests (IDA: SQLite + PostgreSQL, Kalender: SQLite), dann beide Images bauen und nach GHCR pushen
# (ghcr.io/<owner>/<repo>:latest und ghcr.io/<owner>/ida-kalender:latest).
name: Test & Docker-Image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: ida, POSTGRES_USER: ida, POSTGRES_PASSWORD: ida }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ida" --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+asyncpg://ida:ida@localhost:5432/ida' || '' }}
        run: python -m pytest

  kalender-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kalender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: kalender/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: pytest
        run: python -m pytest

  image:
    needs: [test, kalender-test]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: ida, dockerfile: Dockerfile, image: "ghcr.io/${{ github.repository }}" }
          - { name: kalender, dockerfile: kalender/Dockerfile, image: "ghcr.io/${{ github.repository_owner }}/ida-kalender" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
