# IDA – Betrieb. Das Image kommt immer frisch von GitHub (GHCR), gebaut von .github/workflows/docker-publish.yml.
#   cp .env.example .env   (Passwörter eintragen)
#   docker compose up -d
# Update: docker compose pull && docker compose up -d   (oder automatisch: docker compose --profile autoupdate up -d)
name: ida

services:
  app:
    image: ${IDA_IMAGE:-ghcr.io/l8tenever/ida-pa:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ida:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/ida
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}           # leer = erkennt das installierte Embedding-Modell selbst
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}   # Ollama im Stack (siehe unten): Gedächtnis-Suche + „Auto“-Modellwahl
      KALENDER_URL: http://kalender:8000          # Kalender-Dienst (siehe unten); leer = Kalender-Funktionen aus
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      WIKI_URL: http://wiki:8000                  # Wiki-Dienst (siehe unten); leer = Wiki-Funktionen aus
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.kulbarts.com}
      CODE_PUBLIC_URL: ${CODE_PUBLIC_URL:-}         # Code-App (siehe unten); leer = Code-Bereich bleibt in IDA unter /code
      VOICE_URL: http://voice:8000                # Stella (siehe unten); ohne VOICE_SECRET bleibt Stella aus
    ports:
      - "${IDA_PORT:-8080}:8000"
    volumes:
      - ida-data:/data            # Claude-Logins, Sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"   # falls Ollama doch auf dem Host läuft: OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ida
      POSTGRES_USER: ida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - ida-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ida -d ida"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Ollama – lokale Embeddings (nur CPU, kein Port nach außen). Für die Gedächtnis-Suche nach Bedeutung und damit
  # „Auto“ ähnliche bewertete Anfragen wiedererkennt. ollama-init lädt das Embedding-Modell beim Start (einmalig ~270 MB).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}   # so lange bleibt das Modell im RAM nach der letzten Anfrage
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy

  # Kalender – eigener Dienst mit eigenen Daten (SQLite im Volume kalender-data, getrennt von IDA), eigener Port, eigene PWA.
  # Läuft auch ohne IDA. Ida bedient ihn über die calendar_*-Tools; Erinnerungen gehen per Webhook an IDA. Siehe docs/KALENDER.md
  kalender:
    image: ${KALENDER_IMAGE:-ghcr.io/l8tenever/ida-kalender:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      KALENDER_MCP_TOKEN: ${KALENDER_MCP_TOKEN:-}
      KALENDER_PUBLIC_URL: ${KALENDER_PUBLIC_URL:-https://kalender.kulbarts.com}
      KALENDER_STATE: ${KALENDER_STATE:-NW}
      IDA_WEBHOOK_URL: http://app:8000/api/v1/ext/kalender
      IDA_INTERNAL_URL: http://app:8000
    ports:
      - "${KALENDER_PORT:-8082}:8000"
    volumes:
      - kalender-data:/data       # kalender.db, backups/ (nächtlich), files/
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Wiki – eigener Dienst mit Markdown-Vault + SQLite (Volume wiki-data), eigener Port, eigene PWA.
  # Läuft auch ohne IDA. Ida liest/schreibt über wiki_*-Tools; Chats/Agents spiegeln nach ki/. Siehe docs/WIKI.md
  wiki:
    image: ${WIKI_IMAGE:-ghcr.io/l8tenever/ida-wiki:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
      WIKI_MCP_TOKEN: ${WIKI_MCP_TOKEN:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.kulbarts.com}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "${WIKI_PORT:-8083}:8000"
    volumes:
      - wiki-data:/data       # wiki.db, vault/, files/, backups/
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Code – eigene App (eigener Port, eigene PWA) für Projekte und Threads. Hat keine eigenen Daten: KI, Projekte, Git und
  # GitHub laufen weiter in IDA, die App reicht die Aufrufe intern an IDA weiter. Siehe docs/CODE.md
  code:
    image: ${CODE_IMAGE:-ghcr.io/l8tenever/ida-code:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      IDA_INTERNAL_URL: http://app:8000
      CODE_PUBLIC_URL: ${CODE_PUBLIC_URL:-}
      IDA_PUBLIC_URL: ${IDA_PUBLIC_URL:-}
    ports:
      - "${CODE_PORT:-8084}:8000"
    depends_on:
      - app
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Stella – Live-Sprache mit Gemini Live: Live-Knopf in der IDA-App und Telefon über Telnyx. Gleiches Image wie IDA, eigener
  # Container: Updates der App brechen kein Gespräch ab, Watchtower aktualisiert ihn nur, wenn gerade niemand spricht
  # (Hook unten). Kontext, Gedächtnis und Tools holt er sich intern von IDA. Siehe docs/STELLA.md
  voice:
    image: ${IDA_IMAGE:-ghcr.io/l8tenever/ida-pa:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env                                 # VOICE_SECRET, GEMINI_API_KEY, TELNYX_*, STELLA_OWNER_NUMBER, VOICE_PUBLIC_URL
    environment:
      VOICE_IDA_URL: http://app:8000
    command: ["uvicorn", "app.voice.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "${VOICE_PORT:-8086}:8000"                 # öffentlich (Tunnel) unter VOICE_PUBLIC_URL – Telnyx und der Browser müssen hin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - app
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.lifecycle.pre-update: "python -m app.voice.idle"   # Exit 75 = gerade im Gespräch -> später
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "1"

  # Dashboard – eigene App (eigener Port, eigene PWA) für den Server: alle Docker-Stacks sehen, starten/stoppen/aktualisieren,
  # Compose und .env bearbeiten, Logs; Leistung (CPU/RAM/Netz im Verlauf) und Speicher. Siehe docs/DASHBOARD.md
  # ACHTUNG: Der Docker-Socket gibt volle Kontrolle über den Server – nur hinter Cloudflare Access/VPN erreichbar machen.
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/l8tenever/ida-dashboard:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      STACKS_DIRS: ${DASHBOARD_STACKS_DIRS:-/opt/stacks}     # hier wird nach Stack-Ordnern gesucht (findet auch Stacks, die ganz aus sind)
      HOST_ROOT: ${STACKS_ROOT:-/opt}                        # Belegung dieser Platte = „Platte“ im Dashboard
      NET_IFACES: ${DASHBOARD_NET_IFACES:-}                  # leer = alle echten Netzwerkkarten
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      IDA_PUBLIC_URL: ${IDA_PUBLIC_URL:-}
    ports:
      - "${DASHBOARD_PORT:-8085}:8000"
    volumes:
      - dashboard-data:/data                             # dashboard.db (Messwerte), backups/ (alte Stände von Compose/.env)
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKS_ROOT:-/opt}:${STACKS_ROOT:-/opt}        # Stack-Ordner unter DEMSELBEN Pfad wie auf dem Server (sonst stimmen die Pfade für Compose nicht)
      - /proc:/host/proc:ro                              # CPU, RAM und Netz des ganzen Servers
      - ${DOCKER_CONFIG_DIR:-~/.docker}:/root/.docker:ro # Login für private Images (ghcr.io) beim Aktualisieren
    labels:
      ida.dashboard: "self"   # daran erkennt sich das Dashboard selbst (stoppt sich nie selbst)
      com.centurylinklabs.watchtower.enable: "true"

  # optional: holt neue Images von GitHub automatisch (alle 10 Minuten) und startet die App neu
  watchtower:
    image: containrrr/watchtower
    profiles: ["autoupdate"]
    restart: unless-stopped
    command: --label-enable --cleanup --interval 600 --enable-lifecycle-hooks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/config.json:ro   # Login für private GHCR-Images

volumes:
  ollama-data:
  ida-data:
  ida-db:
  kalender-data:
  wiki-data:
  dashboard-data:
