# IDA – Betrieb. Das Image kommt immer frisch von GitHub (GHCR), gebaut von .github/workflows/docker-publish.yml.
#   cp .env.example .env   (Passwörter eintragen)
#   docker compose up -d
# Update: docker compose pull && docker compose up -d   (oder automatisch: docker compose --profile autoupdate up -d)
name: ida

services:
  app:
    image: ${IDA_IMAGE:-ghcr.io/l8tenever/ida-pa:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ida:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/ida
      EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-}           # leer = erkennt das installierte Embedding-Modell selbst
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}   # Ollama im Stack (siehe unten): Gedächtnis-Suche + „Auto“-Modellwahl
      KALENDER_URL: http://kalender:8000          # Kalender-Dienst (siehe unten); leer = Kalender-Funktionen aus
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      WIKI_URL: http://wiki:8000                  # Wiki-Dienst (siehe unten); leer = Wiki-Funktionen aus
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.kulbarts.com}
      TASKS_URL: http://tasks:8000                # Tasks-Dienst (siehe unten); leer = tasks_*-Tools aus
      TASKS_IDA_TOKEN: ${TASKS_IDA_TOKEN:-}
      GOOGLE_API_URL: ${GOOGLE_API_URL:-http://google:4571}   # Google-Dienst (siehe unten): Einstellungen → Google; Token kommt aus .env (GOOGLE_API_TOKEN)
      CODE_PUBLIC_URL: ${CODE_PUBLIC_URL:-}         # Code-App (siehe unten); leer = Code-Bereich bleibt in IDA unter /code
      VOICE_URL: http://voice:8000                # Stella (siehe unten); ohne VOICE_SECRET bleibt Stella aus
      SANDBOX_URL: http://sandbox:8000            # Sandbox der Code-Threads; ohne SANDBOX_SECRET bleibt sie aus
      DASHBOARD_URL: ${DASHBOARD_URL:-http://dashboard:8000}  # Code-Threads: Logs, Befehle, Updates des Server-Stacks ihres Projekts; leer = aus
    ports:
      - "${IDA_PORT:-8080}:8000"
    volumes:
      - ida-data:/data            # Claude-Logins, Sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"   # falls Ollama doch auf dem Host läuft: OLLAMA_URL=http://host.docker.internal:11434
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ida
      POSTGRES_USER: ida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - ida-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ida -d ida"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Ollama – lokale Embeddings (nur CPU, kein Port nach außen). Für die Gedächtnis-Suche nach Bedeutung und damit
  # „Auto“ ähnliche bewertete Anfragen wiedererkennt. ollama-init lädt das Embedding-Modell beim Start (einmalig ~270 MB).
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-30m}   # so lange bleibt das Modell im RAM nach der letzten Anfrage
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"]
    depends_on:
      ollama:
        condition: service_healthy

  # Kalender – eigener Dienst mit eigenen Daten (SQLite im Volume kalender-data, getrennt von IDA), eigener Port, eigene PWA.
  # Läuft auch ohne IDA. Ida bedient ihn über die calendar_*-Tools; Erinnerungen gehen per Webhook an IDA. Siehe docs/KALENDER.md
  kalender:
    image: ${KALENDER_IMAGE:-ghcr.io/l8tenever/ida-kalender:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      KALENDER_MCP_TOKEN: ${KALENDER_MCP_TOKEN:-}
      KALENDER_PUBLIC_URL: ${KALENDER_PUBLIC_URL:-https://kalender.kulbarts.com}
      KALENDER_STATE: ${KALENDER_STATE:-NW}
      IDA_WEBHOOK_URL: http://app:8000/api/v1/ext/kalender
      IDA_INTERNAL_URL: http://app:8000
    ports:
      - "${KALENDER_PORT:-8082}:8000"
    volumes:
      - kalender-data:/data       # kalender.db, backups/ (nächtlich), files/
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Wiki – eigener Dienst mit Markdown-Vault + SQLite (Volume wiki-data), eigener Port, eigene PWA.
  # Läuft auch ohne IDA. Ida liest/schreibt über wiki_*-Tools; Chats/Agents spiegeln nach ki/. Siehe docs/WIKI.md
  wiki:
    image: ${WIKI_IMAGE:-ghcr.io/l8tenever/ida-wiki:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
      WIKI_MCP_TOKEN: ${WIKI_MCP_TOKEN:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.kulbarts.com}
      IDA_CHAT_URL: http://app:8000               # Smart Boards: Ida befüllt sie über den internen Chat
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    ports:
      - "${WIKI_PORT:-8083}:8000"
    volumes:
      - wiki-data:/data       # wiki.db, vault/, files/, backups/
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IDA Mail – Gmail im IDA-Stil (Ordner, Lesen, Schreiben, Antworten, live). Kein eigener Speicher: alles liegt in Gmail; den Zugang
  # (kurzlebiger Token, nur Gmail-Scopes) holt der Dienst beim Dienst "google" – dort ist die Anmeldung (IDA → Einstellungen → Google).
  # Davor gehört Cloudflare Access (z. B. mail.kulbarts.com). Siehe docs/MAIL.md
  mail:
    image: ${MAIL_IMAGE:-ghcr.io/l8tenever/ida-mail:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      GOOGLE_API_URL: http://google:4571
      GOOGLE_API_TOKEN: ${GOOGLE_API_TOKEN:-}
      MAIL_PUBLIC_URL: ${MAIL_PUBLIC_URL:-}
    ports:
      - "${MAIL_PORT:-8094}:8000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IDA Chats – deine Beeper-Chats im IDA-Stil (lesen, schreiben, antworten, Bilder, Sprachnachrichten als Text, live). Chats liegen in Beeper Desktop,
  # im Volume chats-data merkt er sich nur gesehene Nachrichten; der Dienst spricht dessen MCP-Adresse an (BEEPER_MCP_URL + Bearer-Token BEEPER_MCP_TOKEN).
  # Davor gehört Cloudflare Access (z. B. chats.kulbarts.com). Siehe docs/CHATS.md
  chats:
    image: ${CHATS_IMAGE:-ghcr.io/l8tenever/ida-chats:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      BEEPER_MCP_URL: ${BEEPER_MCP_URL:-}
      BEEPER_MCP_TOKEN: ${BEEPER_MCP_TOKEN:-}
      CHATS_PUBLIC_URL: ${CHATS_PUBLIC_URL:-}
      VOICE_PUBLIC_URL: ${VOICE_PUBLIC_URL:-}   # Mikrofon-Knopf in der Leiste unten: öffnet die Live-App (Stella) und startet das Gespräch
      KORREKTUR_URL: ${KORREKTUR_URL:-http://korrektur:8000}   # leer = keine Korrekturvorschläge
      IDA_URL: ${CHATS_IDA_URL:-http://app:8000}   # Tippfehler per Claude Haiku (Einstellungen → Tippfehler in IDA); leer = nur das lokale T5-Modell
    volumes:
      - chats-data:/data       # chats.db: gemerkte Nachrichten (Gelöschtes bleibt lesbar)
    ports:
      - "${CHATS_PORT:-8095}:8000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IDA Korrektur – korrigiert Tippfehler in Chats-Nachrichten mit einem lokalen T5-Modell (nur Prozessor). Kein Port nach außen:
  # nur "chats" fragt hier, sobald du kurz nicht tippst. Das Modell (~1 GB) lädt beim ersten Start ins Volume korrektur-data. Siehe docs/KORREKTUR.md
  korrektur:
    image: ${KORREKTUR_IMAGE:-ghcr.io/l8tenever/ida-korrektur:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      KORREKTUR_THREADS: ${KORREKTUR_THREADS:-4}
    volumes:
      - korrektur-data:/data   # hf/: das heruntergeladene Modell
    mem_limit: ${KORREKTUR_MEM:-3g}
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Tasks – eigene Aufgaben-App (eigener Port, eigene PWA, SQLite im Volume tasks-data). Ida und Stella bedienen sie über die
  # tasks_*-Tools; „Sprechen“ in der App startet Stella im Aufgaben-Modus (Ticket mit VOICE_SECRET, wie die Live-App). Siehe docs/TASKS.md
  # Davor gehört Cloudflare Access: ohne Token gilt jeder Aufruf als du selbst.
  tasks:
    image: ${TASKS_IMAGE:-ghcr.io/l8tenever/ida-tasks:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      TASKS_IDA_TOKEN: ${TASKS_IDA_TOKEN:-}
      TASKS_PUBLIC_URL: ${TASKS_PUBLIC_URL:-}
      VOICE_SECRET: ${VOICE_SECRET:-}           # leer = ohne Sprechen
      VOICE_PUBLIC_URL: ${VOICE_PUBLIC_URL:-}
    ports:
      - "${TASKS_PORT:-8090}:8000"
    volumes:
      - tasks-data:/data       # tasks.db
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IDA HTML (früher CLEO) – Code-Editor mit Live-Vorschau im Browser (html.… und cleo.…). Rein statisch, Projekte liegen im Browser. Siehe docs/HTML.md
  html:
    image: ${HTML_IMAGE:-ghcr.io/l8tenever/ida-html:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${HTML_PORT:-8091}:8000"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IDA Launcher – Startseite mit allen Apps (wie der Cloudflare-Access-Launcher), im IDA-Stil mit Suche und Seiten-Symbolen.
  # Die Liste kommt von selbst aus Cloudflare (Access-Apps + Tunnel-Adressen), neue Apps erscheinen ohne Zutun. Davor gehört
  # Cloudflare Access. Siehe docs/LAUNCHER.md
  launcher:
    image: ${LAUNCHER_IMAGE:-ghcr.io/l8tenever/ida-launcher:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}      # derselbe Token wie beim Cloudflare-MCP (nur Lesen nötig)
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      HIDE: ${LAUNCHER_HIDE:-}                              # Adressen ausblenden, Komma-getrennt, * erlaubt
      EXTRA: ${LAUNCHER_EXTRA:-}                            # zusätzliche Einträge: Name=https://adresse, …
      SHOW_UNPROTECTED: ${LAUNCHER_SHOW_UNPROTECTED:-false} # true = auch Tunnel-Adressen ohne Access-App zeigen
    ports:
      - "${LAUNCHER_PORT:-8093}:8000"
    volumes:
      - launcher-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # IDA Docs – Dokumente schreiben (Markdown, DIN A4, Inhaltsverzeichnis, PDF). Dateien liegen als .idadocs + .md im Volume docs-data;
  # Davor gehört Cloudflare Access. Siehe docs/DOCS.md
  docs:
    image: ${DOCS_IMAGE:-ghcr.io/l8tenever/ida-docs:latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${DOCS_PORT:-8092}:8000"
    volumes:
      - docs-data:/data
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Code – eigene App (eigener Port, eigene PWA) für Projekte und Threads. Hat keine eigenen Daten: KI, Projekte, Git und
  # GitHub laufen weiter in IDA, die App reicht die Aufrufe intern an IDA weiter. Siehe docs/CODE.md
  code:
    image: ${CODE_IMAGE:-ghcr.io/l8tenever/ida-code:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      IDA_INTERNAL_URL: http://app:8000
      CODE_PUBLIC_URL: ${CODE_PUBLIC_URL:-}
      IDA_PUBLIC_URL: ${IDA_PUBLIC_URL:-}
    ports:
      - "${CODE_PORT:-8084}:8000"
    depends_on:
      - app
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Stella – Live-Sprache mit Gemini Live: Live-Knopf in der IDA-App und Telefon über Telnyx. Gleiches Image wie IDA, eigener
  # Container: Updates der App brechen kein Gespräch ab, Watchtower aktualisiert ihn nur, wenn gerade niemand spricht
  # (Hook unten). Kontext, Gedächtnis und Tools holt er sich intern von IDA. Siehe docs/STELLA.md
  voice:
    image: ${IDA_IMAGE:-ghcr.io/l8tenever/ida-pa:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env                                 # VOICE_SECRET, GEMINI_API_KEY, TELNYX_*, STELLA_OWNER_NUMBER, VOICE_PUBLIC_URL
    environment:
      VOICE_IDA_URL: http://app:8000
    command: ["uvicorn", "app.voice.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports:
      - "${VOICE_PORT:-8086}:8000"                 # öffentlich (Tunnel) unter VOICE_PUBLIC_URL – Telnyx und der Browser müssen hin
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - app
    labels:
      com.centurylinklabs.watchtower.enable: "true"
      com.centurylinklabs.watchtower.lifecycle.pre-update: "python -m app.voice.idle"   # Exit 75 = gerade im Gespräch -> später
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "1"

  # Sandbox der Code-Threads: nur dieser Dienst hat den Docker-Socket für IDA, und er kann nur Sandbox-Container anlegen. Bewusst ohne
  # env_file: er kennt keine Zugangsdaten. Ohne eigenen Port, nur app erreicht ihn. Siehe docs/CODE.md
  sandbox:
    image: ${IDA_IMAGE:-ghcr.io/l8tenever/ida-pa:latest}
    pull_policy: always
    restart: unless-stopped
    user: root
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET:-}
    command: ["uvicorn", "app.sandbox.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Dashboard – eigene App (eigener Port, eigene PWA) für den Server: alle Docker-Stacks sehen, starten/stoppen/aktualisieren,
  # Compose und .env bearbeiten, Logs; Leistung (CPU/RAM/Netz im Verlauf) und Speicher. Siehe docs/DASHBOARD.md
  # ACHTUNG: Der Docker-Socket gibt volle Kontrolle über den Server – nur hinter Cloudflare Access/VPN erreichbar machen.
  dashboard:
    image: ${DASHBOARD_IMAGE:-ghcr.io/l8tenever/ida-dashboard:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      STACKS_DIRS: ${DASHBOARD_STACKS_DIRS:-/opt/stacks}     # hier wird nach Stack-Ordnern gesucht (findet auch Stacks, die ganz aus sind)
      HOST_ROOT: ${STACKS_ROOT:-/opt}                        # Belegung dieser Platte = „Platte“ im Dashboard
      NET_IFACES: ${DASHBOARD_NET_IFACES:-}                  # leer = alle echten Netzwerkkarten
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      IDA_PUBLIC_URL: ${IDA_PUBLIC_URL:-}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-}         # Graph: „Im Server ändern“ verlinkt dorthin
      # Cloudflare-API (derselbe Token wie beim Cloudflare-MCP unten): Zero-Trust-Schutz, Tunnel-Routen, Graph und Veröffentlichen
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
    ports:
      - "${DASHBOARD_PORT:-8085}:8000"
    volumes:
      - dashboard-data:/data                             # dashboard.db (Messwerte), backups/ (alte Stände von Compose/.env)
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKS_ROOT:-/opt}:${STACKS_ROOT:-/opt}        # Stack-Ordner unter DEMSELBEN Pfad wie auf dem Server (sonst stimmen die Pfade für Compose nicht)
      - /proc:/host/proc:ro                              # CPU, RAM und Netz des ganzen Servers
      - /:/hostfs:rslave                                 # Tool „Dateien“: der ganze Server mit Schreibrecht (rslave: auch später eingehängte Platten)
      - ${DOCKER_CONFIG_DIR:-~/.docker}:/root/.docker:ro # Login für private Images (ghcr.io) beim Aktualisieren
    labels:
      ida.dashboard: "self"   # daran erkennt sich das Dashboard selbst (stoppt sich nie selbst)
      com.centurylinklabs.watchtower.enable: "true"

  # IDA Server – dieselbe App wie das Dashboard im Modus „server“: Websites hosten (wie Carla, nginx-Dienst „sites“ unten),
  # Stacks und Dateien (genau wie im Dashboard). Veröffentlichen über den Tunnel liegt im Dashboard. Siehe docs/SERVER.md – Adresse z. B. server.kulbarts.com.
  # ACHTUNG: Docker-Socket + Cloudflare-Token mit Schreibrecht – nur hinter Cloudflare Access erreichbar machen.
  server:
    image: ${DASHBOARD_IMAGE:-ghcr.io/l8tenever/ida-dashboard:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_MODE: server
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      STACKS_DIRS: ${DASHBOARD_STACKS_DIRS:-/opt/stacks}
      HOST_ROOT: ${STACKS_ROOT:-/opt}
      SERVER_PUBLIC_URL: ${SERVER_PUBLIC_URL:-}
      DASHBOARD_PUBLIC_URL: ${DASHBOARD_PUBLIC_URL:-}
      IDA_PUBLIC_URL: ${IDA_PUBLIC_URL:-}
      DASHBOARD_URL: http://dashboard:8000             # Messwerte für die Stacks kommen vom Dashboard
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}  # hier mit Schreibrecht: Tunnel Edit, DNS Edit, Access Apps and Policies Edit
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      SITES_DIR: ${SITES_DIR:-/opt/ida-sites}
      SITES_UPSTREAM: ${SITES_UPSTREAM:-}              # leer = aus SITES_PORT und den Tunnel-Regeln
      SITES_TOKEN_DOMAIN: ${SITES_TOKEN_DOMAIN:-website.kulbarts.com}  # „feste Adresse“: <Domain>/<zufälliger Token>
      SITES_TOKEN_LENGTH: ${SITES_TOKEN_LENGTH:-24}    # Standardlänge des Tokens (8–64), pro Seite änderbar
      TUNNEL_HOST_IP: ${TUNNEL_HOST_IP:-}              # leer = aus den vorhandenen Tunnel-Regeln (z. B. 10.7.0.1)
      LINKS_DOMAINS: ${LINKS_DOMAINS:-l.kulbarts.com,link.kulbarts.com,l.l8tenever.com,link.l8tenever.com}
      LINKS_UPSTREAM: ${LINKS_UPSTREAM:-}              # leer = aus dem Port des Dienstes „links“
      WIKI_URL: http://wiki:8000                       # belegte Adressen (Websites, Kurzlinks) ins Wiki-Gedächtnis; leer = aus
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
    ports:
      - "${SERVER_PORT:-8088}:8000"
    volumes:
      - server-data:/data                              # sites.json (Websites, ggf. GitHub-Tokens)
      - links-data:/links                              # Kurzlinks, geteilt mit dem Dienst „links“
      - /var/run/docker.sock:/var/run/docker.sock
      - ${STACKS_ROOT:-/opt}:${STACKS_ROOT:-/opt}
      - ${SITES_DIR:-/opt/ida-sites}:${SITES_DIR:-/opt/ida-sites}
      - /:/hostfs:rslave
      - ${DOCKER_CONFIG_DIR:-~/.docker}:/root/.docker:ro
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Websites des IDA Servers: ein nginx für alle Seiten. Die Konfiguration schreibt der Server (Tool Websites).
  sites:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${SITES_PORT:-8087}:80"                     # hierauf zeigt der Tunnel; besser an die Tunnel-IP binden, z. B. 10.7.0.1:8087
    volumes:
      - ${SITES_DIR:-/opt/ida-sites}/www:/srv/www:ro
      - ${SITES_DIR:-/opt/ida-sites}/conf:/etc/nginx/conf.d:ro
    labels:
      ida.sites: "nginx"

  # Weiterleitungen: öffentlicher Dienst für die Kurzlinks (dieselbe App im Modus „links“). Bewusst OHNE Docker-Socket und ohne
  # Cloudflare-Token: Er kennt nur die Link-Datenbank. Verwaltet wird im IDA Server, die Domains richtet das Tool dort ein.
  links:
    image: ${DASHBOARD_IMAGE:-ghcr.io/l8tenever/ida-dashboard:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_MODE: links
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      LINKS_DOMAINS: ${LINKS_DOMAINS:-l.kulbarts.com,link.kulbarts.com,l.l8tenever.com,link.l8tenever.com}
    ports:
      - "${LINKS_PORT:-8089}:8000"                     # hierauf zeigt der Tunnel; besser an die Tunnel-IP binden, z. B. 10.7.0.1:8089
    volumes:
      - links-data:/links
    labels:
      ida.links: "public"
      com.centurylinklabs.watchtower.enable: "true"

  # Cloudflare-MCP (github.com/L8teNever/Ida-Cloudflare): Zonen/DNS, Tunnel, Zero Trust … als MCP-Server für die Agents.
  # An mit COMPOSE_PROFILES=cloudflare in .env. Intern für IDA: http://cloudflare:8030/mcp (Bearer CLOUDFLARE_MCP_TOKEN).
  # Das Dashboard nutzt denselben CLOUDFLARE_API_TOKEN direkt (nur lesend), siehe oben.
  cloudflare:
    image: ${CLOUDFLARE_MCP_IMAGE:-ghcr.io/l8tenever/ida-cloudflare:latest}
    profiles: ["cloudflare"]
    pull_policy: always
    restart: unless-stopped
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      MCP_AUTH_TOKEN: ${CLOUDFLARE_MCP_TOKEN:-}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8030
    ports:
      - "${CLOUDFLARE_MCP_PORT:-127.0.0.1:8030}:8030"   # z. B. 10.7.0.1:8030, wenn der Tunnel wie bisher darauf zeigt
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Google (ersetzt den einzeln laufenden Ida-Google-MCP): ein Dienst für alle Google-Funktionen (Tasks, Kontakte, Kalender, Gmail, Docs,
  # Sheets, Slides, Chat, Meet, Health, Drive). Keine öffentliche Adresse: 4569 = MCP nur für Dienste im Haus (Bearer GOOGLE_MCP_TOKEN, z. B. Agents
  # über IDA), 4571 = interne REST-API (http://google:4571/api/v1/…, nicht veröffentlicht, siehe docs/GOOGLE.md). Die Google-Anmeldung läuft über IDA
  # (Einstellungen → Google); in der Google Cloud Console muss <IDA_PUBLIC_URL>/api/v1/google/callback als Weiterleitungs-URI stehen.
  # Dazu zwei Aufgaben im Hintergrund: Kalender-Abgleich (CALENDAR_SYNC=1) und Docs-Backup nach Google Drive (DOCS_BACKUP=1).
  # An mit COMPOSE_PROFILES=google in .env.
  google:
    image: ${GOOGLE_IMAGE:-ghcr.io/l8tenever/ida-google-stack:latest}
    profiles: ["google"]
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${IDA_PUBLIC_URL:-}/api/v1/google/callback   # Rückweg von Google: über IDA
      MCP_AUTH_TOKEN: ${GOOGLE_MCP_TOKEN:-}
      GOOGLE_API_TOKEN: ${GOOGLE_API_TOKEN:-}            # leer = interne API ohne Token (nur im Docker-Netz erreichbar)
      GOOGLE_TOKEN_FILE_PATH: /data/google_token.json
      DATA_DIR: /data
      KALENDER_URL: http://kalender:8000
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      CALENDAR_SYNC: ${GOOGLE_CALENDAR_SYNC:-0}          # 1 = IDA-Kalender und Google-Kalender gleichen sich ab
      CALENDAR_SYNC_KALENDER: ${GOOGLE_CALENDAR_SYNC_KALENDER:-}   # Name/ID des IDA-Kalenders; leer = Standardkalender
      DOCS_URL: http://docs:8000
      DOCS_BACKUP: ${GOOGLE_DOCS_BACKUP:-0}              # 1 = täglich eine Sicherung von IDA Docs nach Google Drive
    ports:
      - "${GOOGLE_MCP_PORT:-127.0.0.1:4569}:4569"
    volumes:
      - google-data:/data                                 # google_token.json (Anmeldung) und hub.db (Abgleich-Stand)
    depends_on:
      - kalender
      - docs
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # optional: holt neue Images von GitHub automatisch (alle 10 Minuten) und startet die App neu.
  # Das Tool „Updates“ im IDA Server kann das mit Zeitplan und Ausnahmen; beides zusammen nicht nutzen.
  watchtower:
    image: containrrr/watchtower
    profiles: ["autoupdate"]
    restart: unless-stopped
    command: --label-enable --cleanup --interval 600 --enable-lifecycle-hooks
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/config.json:ro   # Login für private GHCR-Images

volumes:
  ollama-data:
  ida-data:
  ida-db:
  kalender-data:
  wiki-data:
  dashboard-data:
  server-data:
  links-data:
  tasks-data:
  chats-data:
  korrektur-data:
  docs-data:
  launcher-data:
  google-data:
