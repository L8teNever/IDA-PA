# IDA – Betrieb. Das Image kommt immer frisch von GitHub (GHCR), gebaut von .github/workflows/docker-publish.yml.
#   cp .env.example .env   (Passwörter eintragen)
#   docker compose up -d
# Update: docker compose pull && docker compose up -d   (oder automatisch: docker compose --profile autoupdate up -d)
name: ida

services:
  app:
    image: ${IDA_IMAGE:-ghcr.io/l8tenever/ida-pa:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://ida:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}@db:5432/ida
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      KALENDER_URL: http://kalender:8000          # Kalender-Dienst (siehe unten); leer = Kalender-Funktionen aus
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      WIKI_URL: http://wiki:8000                  # Wiki-Dienst (siehe unten); leer = Wiki-Funktionen aus
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.kulbarts.com}
    ports:
      - "${IDA_PORT:-8080}:8000"
    volumes:
      - ida-data:/data            # Claude-Logins, Sandbox
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Ollama auf dem Host (optional, fürs Gedächtnis)
    depends_on:
      db:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ida
      POSTGRES_USER: ida
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in .env setzen}
    volumes:
      - ida-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ida -d ida"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kalender – eigener Dienst mit eigenen Daten (SQLite im Volume kalender-data, getrennt von IDA), eigener Port, eigene PWA.
  # Läuft auch ohne IDA. Ida bedient ihn über die calendar_*-Tools; Erinnerungen gehen per Webhook an IDA. Siehe docs/KALENDER.md
  kalender:
    image: ${KALENDER_IMAGE:-ghcr.io/l8tenever/ida-kalender:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      KALENDER_IDA_TOKEN: ${KALENDER_IDA_TOKEN:-}
      KALENDER_MCP_TOKEN: ${KALENDER_MCP_TOKEN:-}
      KALENDER_PUBLIC_URL: ${KALENDER_PUBLIC_URL:-https://kalender.kulbarts.com}
      KALENDER_STATE: ${KALENDER_STATE:-NW}
      IDA_WEBHOOK_URL: http://app:8000/api/v1/ext/kalender
      IDA_INTERNAL_URL: http://app:8000
    ports:
      - "${KALENDER_PORT:-8082}:8000"
    volumes:
      - kalender-data:/data       # kalender.db, backups/ (nächtlich), files/
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Wiki – eigener Dienst mit Markdown-Vault + SQLite (Volume wiki-data), eigener Port, eigene PWA.
  # Läuft auch ohne IDA. Ida liest/schreibt über wiki_*-Tools; Chats/Agents spiegeln nach ki/. Siehe docs/WIKI.md
  wiki:
    image: ${WIKI_IMAGE:-ghcr.io/l8tenever/ida-wiki:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      TIMEZONE: ${TIMEZONE:-Europe/Berlin}
      WIKI_IDA_TOKEN: ${WIKI_IDA_TOKEN:-}
      WIKI_MCP_TOKEN: ${WIKI_MCP_TOKEN:-}
      WIKI_PUBLIC_URL: ${WIKI_PUBLIC_URL:-https://wiki.kulbarts.com}
      OLLAMA_URL: ${OLLAMA_URL:-}
    ports:
      - "${WIKI_PORT:-8083}:8000"
    volumes:
      - wiki-data:/data       # wiki.db, vault/, files/, backups/
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # optional: holt neue Images von GitHub automatisch (alle 10 Minuten) und startet die App neu
  watchtower:
    image: containrrr/watchtower
    profiles: ["autoupdate"]
    restart: unless-stopped
    command: --label-enable --cleanup --interval 600
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_DIR:-~/.docker}/config.json:/config.json:ro   # Login für private GHCR-Images

volumes:
  ida-data:
  ida-db:
  kalender-data:
  wiki-data:
