[package]
name = "ida-chats"
version = "1.0.0"
description = "IDA Chats als Android-App"
edition = "2021"
publish = false

[lib]
name = "ida_chats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
# klein und sparsam: die App ist nur die Hülle um die Chats-Seite
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
