# Lokal selbst bauen statt von GitHub zu ziehen:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  app:
    image: ida-pa:dev
    pull_policy: build
    build: .
  voice:
    image: ida-pa:dev
    pull_policy: never   # nutzt das Image, das „app“ baut
  kalender:
    image: ida-kalender:dev
    pull_policy: build
    build:
      context: .
      dockerfile: kalender/Dockerfile
  wiki:
    image: ida-wiki:dev
    pull_policy: build
    build:
      context: .
      dockerfile: wiki/Dockerfile
  code:
    image: ida-code:dev
    pull_policy: build
    build:
      context: .
      dockerfile: code/Dockerfile
  dashboard:
    image: ida-dashboard:dev
    pull_policy: build
    build:
      context: .
      dockerfile: dashboard/Dockerfile
  docs:
    image: ida-docs:dev
    pull_policy: build
    build:
      context: .
      dockerfile: dokumente/Dockerfile
